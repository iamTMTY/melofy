name: Build & Deploy Melofy

on:
  push:
    branches: [main]
    # Only rebuild when the web app / shared code / image definition changes.
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/Dockerfile.web'
      - 'infra/docker-compose.app.yml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-melofy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push image to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "repo=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/melofy-web:latest
            ghcr.io/${{ steps.img.outputs.repo }}/melofy-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SPOTIFY_CLIENT_ID=${{ secrets.NEXT_PUBLIC_SPOTIFY_CLIENT_ID }}
            NEXT_PUBLIC_SPOTIFY_REDIRECT_URI=https://melofy.temi.codes/api/auth/spotify/callback
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/melofy
            docker compose --env-file .env.production -f docker-compose.app.yml pull web
            docker compose --env-file .env.production -f docker-compose.app.yml up -d
            docker image prune -f
